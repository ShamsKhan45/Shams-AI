<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080418">
<meta name="description" content="An AI-powered assistant for everyone around the world. Ask questions, learn new things, and get help.">
<link rel="manifest" href="./manifest.json">
<title>Shams AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080418;color:white;font-family:Arial,sans-serif}
header{padding:20px 25px;border-bottom:1px solid #202b40;color:#38a5ff;font-size:25px;font-weight:bold}
main{max-width:850px;margin:70px auto;padding:20px;text-align:center}
h1{font-size:38px}
#answer{margin:30px 0;background:#11152a;padding:20px;border-radius:10px;text-align:left;min-height:100px;white-space:pre-wrap}
#inputBox{width:70%;padding:12px;border-radius:8px;border:none}
#btn{padding:12px 20px;border-radius:8px;border:none;background:#00c87a;color:black;font-weight:bold;cursor:pointer;margin-left:5px}
</style>
</head>
<body>
<header>Shams AI</header>
<main>
<h1>Ask Anything</h1>
<input id="message" type="text" placeholder="Type your message..." id="inputBox">
<button id="btn" onclick="ask()">Ask</button>
<div id="answer">Hello! I am Shams AI. How can I help you today?</div>
</main>
<script>
async function ask(){
const input=document.getElementById('message');
const answer=document.getElementById('answer');
const message=input.value;
if(!message)return;
answer.textContent="Thinking...";
try{
const response=await fetch(
"https://shams-ai-backend.armankhanqw112.workers.dev",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
}
);
const data=await response.json();
if(!response.ok)throw new Error();
answer.textContent="You: "+message+"\n\nShams AI: "+(data.reply||data.error||"No reply received.");
}catch(error){
answer.textContent="Connection error. Please try again.";
}
}
</script>
<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
