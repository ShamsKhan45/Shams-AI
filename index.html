
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<meta name="description" content="An AI-powered assistant for everyone around the world. Ask questions, learn new things, and explore ideas with Shams AI.">
<link rel="manifest" href="/Shams-AI/manifest.json">
<title>Shams AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:20px 25px;border-bottom:1px solid #202b40;color:#38a5ff;font-size:25px;font-weight:bold}
main{max-width:850px;margin:70px auto;padding:20px;text-align:center}
h1{font-size:38px}
h1 span{color:#168cff}
p{color:#aab6ca}
.shortcuts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:35px 0}
button{cursor:pointer}
.shortcuts button{background:#111d30;color:white;border:1px solid #263b59;border-radius:12px;padding:13px}
.chat{display:flex;background:#111d30;border:1px solid #263b59;border-radius:16px;padding:10px;margin-top:35px}
.chat input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:16px}
.chat button{background:#168cff;color:white;border:0;border-radius:10px;padding:12px 20px}
#answer{margin:25px auto;text-align:left;max-width:700px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
footer{margin-top:65px;color:#71809a;font-size:13px}
@media(max-width:600px){
main{margin:35px auto}
h1{font-size:30px}
.chat{padding:6px}
.chat button{padding:10px}
}
</style>
</head>

<body>
<header>✦ Shams AI</header>

<main>
<h1>Welcome to <span>Shams AI</span></h1>
<p>Your AI assistant. Ask anything and explore your ideas.</p>

<div class="shortcuts">
<button onclick="ask('Help me learn English')">Learn English</button>
<button onclick="ask('Explain science simply')">Science Help</button>
<button onclick="ask('Give me business ideas')">Business Ideas</button>
</div>

<div class="chat">
<input id="message" placeholder="Ask Shams AI anything...">
<button onclick="sendMessage()">Send</button>
</div>

<div id="answer"></div>
<footer>Shams AI · Created by Shams Khan</footer>
</main>

<script>
async function ask(text){
document.getElementById("message").value=text;
await sendMessage();
}

async function sendMessage(){
const input=document.getElementById("message");
const answer=document.getElementById("answer");
const message=input.value.trim();

if(!message)return;

answer.textContent="Shams AI is thinking...";
input.value="";

try{
const response=await fetch(
"https://shams-ai-backend.armankhanqw112.workers.dev",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
}
);

const data=await response.json();

if(!response.ok)throw new Error();

answer.textContent="You: "+message+
"\n\nShams AI: "+(data.reply||data.error||"No reply received.");

}catch(error){
answer.textContent="Connection error. Please try again.";
}
}
</script>
</body>
</html>
